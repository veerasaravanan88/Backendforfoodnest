<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Dispatch — AdvanceFoodnest</title>
  <link rel="stylesheet" href="../shared/css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="padding: 10px 12px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px;">
        <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Restaurant Partner</div>
        <div id="sidebar-restaurant-name" style="font-size: 1.15rem; font-weight: 800; color: var(--dark);">...</div>
      </div>

      <ul class="sidebar-menu">
        <li><a href="./dashboard.html" class="sidebar-link">📊 Dashboard</a></li>
        <li><a href="./dishes.html" class="sidebar-link">🍲 Dishes & Menu</a></li>
        <li><a href="./orders.html" class="sidebar-link active">📦 Orders Dispatch</a></li>
        <li><a href="./reports.html" class="sidebar-link">📈 Sales Reports</a></li>
        <li><a href="./profile.html" class="sidebar-link">⚙️ Kitchen Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 2rem;">Incoming Kitchen Orders</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Accept orders, manage prep status, and auto-dispatch riders upon marking Ready.</p>
        </div>
        <button id="refresh-orders-btn" class="btn btn-outline btn-sm">
          🔄 Refresh Orders
        </button>
      </div>

      <!-- Status Filters -->
      <div class="category-strip" id="status-filter-strip" style="margin-bottom: 24px;">
        <button class="category-chip active" data-status="">All Orders</button>
        <button class="category-chip" data-status="PLACED">Pending Accept (PLACED)</button>
        <button class="category-chip" data-status="ACCEPTED">Accepted</button>
        <button class="category-chip" data-status="PREPARING">Preparing</button>
        <button class="category-chip" data-status="READY">Ready for Pickup</button>
        <button class="category-chip" data-status="OUT_FOR_DELIVERY">On the Way</button>
        <button class="category-chip" data-status="DELIVERED">Delivered</button>
      </div>

      <!-- Orders List Container -->
      <div id="orders-cards-container" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="card skeleton" style="height: 180px;"></div>
        <div class="card skeleton" style="height: 180px;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, renderNavbar } from '../shared/js/auth.js';
    import { apiRequest } from '../shared/js/api.js';
    import { showToast } from '../shared/js/toast.js';

    let currentStatusFilter = '';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth('RESTAURANT');
      if (!user) return;
      renderNavbar('orders');

      document.getElementById('sidebar-restaurant-name').textContent = user.fullName || 'My Restaurant';

      setupFilterTabs();
      loadOrders();

      document.getElementById('refresh-orders-btn').addEventListener('click', () => {
        loadOrders();
        showToast('Orders refreshed', 'info');
      });

      // Periodic auto-check for new orders
      setInterval(loadOrders, 5000);
    });

    function setupFilterTabs() {
      document.querySelectorAll('#status-filter-strip .category-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#status-filter-strip .category-chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          currentStatusFilter = btn.dataset.status;
          loadOrders();
        });
      });
    }

    async function loadOrders() {
      let endpoint = '/restaurant/me/orders';
      if (currentStatusFilter) {
        endpoint += `?status=${currentStatusFilter}`;
      }

      const res = await apiRequest(endpoint);
      const container = document.getElementById('orders-cards-container');

      if (!res.success || !res.data) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">Failed to load orders.</div>';
        return;
      }

      const orders = res.data;
      if (orders.length === 0) {
        container.innerHTML = `
          <div style="background: #FFF; border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: 60px; text-align: center; color: var(--text-muted);">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🍽️</div>
            <h3>No orders found in this category</h3>
            <p style="font-size: 0.9rem; margin-top: 4px;">Orders placed by hungry customers will show up here automatically.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const itemsHtml = o.items.map(i => `
          <div style="display: flex; justify-content: space-between; font-size: 0.92rem; padding: 4px 0;">
            <span><strong style="color: var(--primary);">${i.quantity}x</strong> ${i.dishName}</span>
            <span style="font-weight: 600;">₹${i.itemTotal}</span>
          </div>
        `).join('');

        let riderBadge = '';
        if (o.deliveryAssignment && o.deliveryAssignment.deliveryManName) {
          riderBadge = `
            <div style="background: var(--gray-bg); padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.85rem; display: flex; align-items: center; gap: 8px; margin-top: 12px;">
              <span>🛵</span>
              <span><strong>Rider:</strong> ${o.deliveryAssignment.deliveryManName} (${o.deliveryAssignment.deliveryManPhone})</span>
              <span class="status-badge status-accepted" style="font-size: 0.7rem; margin-left: auto;">${o.deliveryAssignment.status}</span>
            </div>
          `;
        } else if (o.status === 'READY' || o.status === 'ACCEPTED' || o.status === 'PREPARING') {
          riderBadge = `
            <div style="background: var(--warning-light); color: var(--warning); padding: 8px 14px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; margin-top: 12px;">
              🛵 Searching nearby online delivery partners...
            </div>
          `;
        }

        // Action Buttons based on state machine
        let actionButtons = '';
        if (o.status === 'PLACED') {
          actionButtons = `
            <button class="btn btn-primary btn-sm update-status-btn" data-id="${o.id}" data-status="ACCEPTED">
              Accept Order ✓
            </button>
            <button class="btn btn-danger btn-sm update-status-btn" data-id="${o.id}" data-status="CANCELLED" style="margin-left: 8px;">
              Reject Order ✕
            </button>
          `;
        } else if (o.status === 'ACCEPTED') {
          actionButtons = `
            <button class="btn btn-primary btn-sm update-status-btn" data-id="${o.id}" data-status="PREPARING">
              Start Cooking / Preparing 🍳
            </button>
          `;
        } else if (o.status === 'PREPARING') {
          actionButtons = `
            <button class="btn btn-success btn-sm update-status-btn" data-id="${o.id}" data-status="READY">
              Mark Food READY (Trigger Rider Dispatch) 🚀
            </button>
          `;
        } else if (o.status === 'READY') {
          actionButtons = `<span style="font-size: 0.88rem; color: var(--success); font-weight: 700;">✓ Food Packed. Waiting for Rider Pickup.</span>`;
        } else if (o.status === 'PICKED_UP' || o.status === 'OUT_FOR_DELIVERY') {
          actionButtons = `<span style="font-size: 0.88rem; color: var(--primary); font-weight: 700;">🛵 Rider picked up and out for delivery.</span>`;
        } else if (o.status === 'DELIVERED') {
          actionButtons = `<span style="font-size: 0.88rem; color: var(--success); font-weight: 700;">✓ Completed & Paid (COD)</span>`;
        }

        return `
          <div class="card" style="padding: 24px; background: #FFF;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
              <div>
                <span style="font-size: 1.15rem; font-weight: 800; color: var(--dark);">${o.orderNumber}</span>
                <span style="color: var(--text-muted); font-size: 0.85rem; margin-left: 10px;">Placed ${new Date(o.createdAt).toLocaleTimeString()}</span>
              </div>
              <span class="status-badge status-${o.status.toLowerCase()}">${o.status.replace(/_/g, ' ')}</span>
            </div>

            <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px;">
              <div>
                <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: 700; margin-bottom: 6px;">ITEMS ORDERED</div>
                <div style="background: var(--gray-bg); padding: 12px 16px; border-radius: var(--radius-md);">
                  ${itemsHtml}
                  ${o.customerNotes ? `
                    <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 0.82rem; color: var(--text-muted);">
                      <strong>Special Note:</strong> ${o.customerNotes}
                    </div>
                  ` : ''}
                </div>
                ${riderBadge}
              </div>

              <div>
                <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: 700; margin-bottom: 6px;">CUSTOMER & DELIVERY DETAILS</div>
                <div style="font-size: 0.95rem; font-weight: 700; color: var(--dark);">${o.customerName}</div>
                <div style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 8px;">📞 ${o.customerPhone}</div>
                <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px;">📍 ${o.deliveryAddress}</div>

                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 10px;">
                  <span>Total Amount</span>
                  <span style="color: var(--primary);">₹${o.totalAmount}</span>
                </div>
              </div>
            </div>

            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; align-items: center;">
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('.update-status-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const orderId = btn.dataset.id;
          const newStatus = btn.dataset.status;

          btn.disabled = true;
          const res = await apiRequest(`/restaurant/me/orders/${orderId}/status`, {
            method: 'PUT',
            body: JSON.stringify({ status: newStatus })
          });

          if (res.success) {
            showToast(`Order updated to ${newStatus}!`, 'success');
            loadOrders();
          } else {
            showToast(res.message || 'Status transition failed', 'error');
            btn.disabled = false;
          }
        });
      });
    }
  </script>
</body>
</html>
