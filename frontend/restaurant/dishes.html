<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Dishes — AdvanceFoodnest</title>
  <link rel="stylesheet" href="/shared/css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div style="padding: 10px 12px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px;">
        <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Restaurant Partner</div>
        <div id="sidebar-restaurant-name" style="font-size: 1.15rem; font-weight: 800; color: var(--dark);">...</div>
      </div>

      <ul class="sidebar-menu">
        <li><a href="/restaurant/dashboard.html" class="sidebar-link">📊 Dashboard</a></li>
        <li><a href="/restaurant/dishes.html" class="sidebar-link active">🍲 Dishes & Menu</a></li>
        <li><a href="/restaurant/orders.html" class="sidebar-link">📦 Orders Dispatch</a></li>
        <li><a href="/restaurant/reports.html" class="sidebar-link">📈 Sales Reports</a></li>
        <li><a href="/restaurant/profile.html" class="sidebar-link">⚙️ Kitchen Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 style="font-size: 2rem;">Menu & Dish Management</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Manage your kitchen's menu items, pricing, stock, and live availability.</p>
        </div>
        <button id="open-add-dish-modal-btn" class="btn btn-primary">
          + Add New Dish
        </button>
      </div>

      <div class="grid-dishes" id="dishes-grid">
        <div class="card skeleton" style="height: 280px;"></div>
        <div class="card skeleton" style="height: 280px;"></div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Dish Modal -->
  <div class="modal-overlay" id="dish-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add New Dish</h3>
        <button class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <form id="dish-form">
        <div class="modal-body">
          <input type="hidden" id="dish-id">

          <div class="form-group">
            <label class="form-label" for="dish-name">Dish Name</label>
            <input type="text" id="dish-name" class="form-input" placeholder="e.g. Chicken 65" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="dish-category">Category</label>
              <input type="text" id="dish-category" class="form-input" placeholder="e.g. Starters, Biryani" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="dish-price">Price (₹)</label>
              <input type="number" id="dish-price" class="form-input" step="0.50" min="1" placeholder="220.00" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="dish-stock">Available Stock</label>
              <input type="number" id="dish-stock" class="form-input" min="0" value="50" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="dish-available">Available on Menu</label>
              <select id="dish-available" class="form-select">
                <option value="true">Yes (Active)</option>
                <option value="false">No (Sold Out)</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="dish-image">Image URL</label>
            <input type="url" id="dish-image" class="form-input" placeholder="https://images.unsplash.com/...">
          </div>

          <div class="form-group">
            <label class="form-label" for="dish-desc">Description</label>
            <textarea id="dish-desc" class="form-textarea" rows="2" placeholder="Ingredients and flavor profile..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modal-save-btn">Save Dish</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, renderNavbar } from '/shared/js/auth.js';
    import { apiRequest } from '/shared/js/api.js';
    import { showToast } from '/shared/js/toast.js';

    let dishes = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth('RESTAURANT');
      if (!user) return;
      renderNavbar('dishes');

      document.getElementById('sidebar-restaurant-name').textContent = user.fullName || 'My Restaurant';

      setupModal();
      loadDishes();
    });

    async function loadDishes() {
      // Calls /api/restaurant/me/dishes which strictly returns only authenticated restaurant's dishes
      const res = await apiRequest('/restaurant/me/dishes');
      const grid = document.getElementById('dishes-grid');

      if (!res.success || !res.data) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Failed to load dishes.</div>';
        return;
      }

      dishes = res.data;
      if (dishes.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px; background: #FFF; border-radius: var(--radius-lg); border: 1px dashed var(--border);">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🍽️</div>
            <h3>No dishes on your menu yet</h3>
            <p style="font-size: 0.9rem; margin-top: 4px; margin-bottom: 16px;">Add dishes to start receiving orders!</p>
            <button class="btn btn-primary" onclick="window.openAddModal()">+ Add Your First Dish</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = dishes.map(d => `
        <div class="card">
          <div class="card-img-wrap">
            <img src="${d.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'}" alt="${d.name}" class="card-img">
            <span class="card-badge">${d.category}</span>
            <span class="status-badge ${d.isAvailable ? 'status-delivered' : 'status-cancelled'}" style="position: absolute; bottom: 12px; right: 12px;">
              ${d.isAvailable ? 'In Stock' : 'Unavailable'}
            </span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${d.name}</h3>
            <p class="card-subtitle" style="font-size: 0.82rem; height: 38px; overflow: hidden; text-overflow: ellipsis;">
              ${d.description || ''}
            </p>
            <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">
              Stock: <strong>${d.availableStock}</strong>
            </div>
            <div class="card-footer">
              <span class="dish-price">₹${d.price}</span>
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline btn-sm edit-dish-btn" data-id="${d.id}">Edit</button>
                <button class="btn btn-outline btn-sm delete-dish-btn" data-id="${d.id}" style="color: var(--danger); border-color: rgba(239,68,68,0.3);">✕</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.edit-dish-btn').forEach(b => {
        b.addEventListener('click', () => openEditModal(parseInt(b.dataset.id)));
      });

      grid.querySelectorAll('.delete-dish-btn').forEach(b => {
        b.addEventListener('click', () => deleteDish(parseInt(b.dataset.id)));
      });
    }

    function setupModal() {
      const modal = document.getElementById('dish-modal');
      const openBtn = document.getElementById('open-add-dish-modal-btn');
      const closeBtn = document.getElementById('modal-close-btn');
      const cancelBtn = document.getElementById('modal-cancel-btn');
      const form = document.getElementById('dish-form');

      openBtn.addEventListener('click', () => openAddModal());
      closeBtn.addEventListener('click', () => modal.classList.remove('open'));
      cancelBtn.addEventListener('click', () => modal.classList.remove('open'));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const dishId = document.getElementById('dish-id').value;
        const payload = {
          name: document.getElementById('dish-name').value.trim(),
          category: document.getElementById('dish-category').value.trim(),
          price: parseFloat(document.getElementById('dish-price').value),
          availableStock: parseInt(document.getElementById('dish-stock').value),
          isAvailable: document.getElementById('dish-available').value === 'true',
          imageUrl: document.getElementById('dish-image').value.trim() || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600',
          description: document.getElementById('dish-desc').value.trim()
        };

        let res;
        if (dishId) {
          // Update
          res = await apiRequest(`/restaurant/me/dishes/${dishId}`, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
        } else {
          // Create
          res = await apiRequest('/restaurant/me/dishes', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
        }

        if (res.success) {
          showToast(dishId ? 'Dish updated successfully!' : 'Dish added successfully!', 'success');
          modal.classList.remove('open');
          loadDishes();
        } else {
          showToast(res.message || 'Error saving dish', 'error');
        }
      });
    }

    window.openAddModal = function() {
      document.getElementById('modal-title').textContent = 'Add New Dish';
      document.getElementById('dish-id').value = '';
      document.getElementById('dish-form').reset();
      document.getElementById('dish-available').value = 'true';
      document.getElementById('dish-modal').classList.add('open');
    };

    function openEditModal(dishId) {
      const d = dishes.find(x => x.id === dishId);
      if (!d) return;

      document.getElementById('modal-title').textContent = 'Edit Dish';
      document.getElementById('dish-id').value = d.id;
      document.getElementById('dish-name').value = d.name;
      document.getElementById('dish-category').value = d.category;
      document.getElementById('dish-price').value = d.price;
      document.getElementById('dish-stock').value = d.availableStock;
      document.getElementById('dish-available').value = d.isAvailable ? 'true' : 'false';
      document.getElementById('dish-image').value = d.imageUrl || '';
      document.getElementById('dish-desc').value = d.description || '';

      document.getElementById('dish-modal').classList.add('open');
    }

    async function deleteDish(dishId) {
      if (confirm('Are you sure you want to delete this dish?')) {
        const res = await apiRequest(`/restaurant/me/dishes/${dishId}`, { method: 'DELETE' });
        if (res.success) {
          showToast('Dish deleted successfully', 'info');
          loadDishes();
        } else {
          showToast(res.message || 'Error deleting dish', 'error');
        }
      }
    }
  </script>
</body>
</html>
