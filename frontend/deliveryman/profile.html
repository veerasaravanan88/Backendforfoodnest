<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Profile — AdvanceFoodnest</title>
  <link rel="stylesheet" href="/shared/css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container container-sm" style="padding-top: 40px; padding-bottom: 70px;">
    <div style="margin-bottom: 28px;">
      <h1 style="font-size: 2.2rem;">Delivery Partner Profile</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">Fleet information and account credentials.</p>
    </div>

    <div class="form-card">
      <form id="rider-profile-form">
        <div class="form-group">
          <label class="form-label" for="email">Account Email (Read-only)</label>
          <input type="email" id="email" class="form-input" disabled style="background: var(--gray-bg); cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" disabled style="background: var(--gray-bg);">
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Contact Phone</label>
          <input type="tel" id="phone" class="form-input" disabled style="background: var(--gray-bg);">
        </div>

        <div class="form-group">
          <label class="form-label" for="vehicleType">Registered Vehicle</label>
          <input type="text" id="vehicleType" class="form-input" disabled style="background: var(--gray-bg);">
        </div>

        <div style="margin-top: 24px; text-align: center;">
          <a href="/deliveryman/dashboard.html" class="btn btn-primary btn-full">Return to Rider Hub</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, renderNavbar } from '/shared/js/auth.js';
    import { apiRequest } from '/shared/js/api.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth('DELIVERY_MAN');
      if (!user) return;
      renderNavbar();

      const res = await apiRequest('/deliveryman/me');
      if (res.success && res.data) {
        const d = res.data;
        document.getElementById('email').value = d.email;
        document.getElementById('fullName').value = d.fullName;
        document.getElementById('phone').value = d.phone;
        document.getElementById('vehicleType').value = d.vehicleType || 'Motorbike';
      }
    });
  </script>
</body>
</html>
