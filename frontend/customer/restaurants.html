<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Restaurants — AdvanceFoodnest</title>
  <link rel="stylesheet" href="../shared/css/style.css">
  <style>
    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .restaurant-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12), 0 4px 14px rgba(255,107,0,0.15);
      border-color: rgba(255, 107, 0, 0.4);
    }
    .restaurant-card:hover .card-img {
      transform: scale(1.06);
    }

    .discount-ribbon {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: linear-gradient(135deg, rgba(23, 23, 23, 0.9) 0%, rgba(38, 38, 38, 0.95) 100%);
      backdrop-filter: blur(8px);
      color: #FFF;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .bottom-checkout-pill {
      background: linear-gradient(135deg, var(--primary) 0%, #FF8526 100%);
      color: #FFF;
      border: none;
      border-radius: var(--radius-full);
      padding: 10px 22px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 107, 0, 0.45);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .bottom-checkout-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(255, 107, 0, 0.6);
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container" style="padding-top: 36px; padding-bottom: 90px;">
    
    <!-- Header Hero Intro -->
    <div style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px;">
      <div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">
          <span>🍽️</span> Verified Culinary Partners
        </div>
        <h1 style="font-size: 2.2rem; letter-spacing: -0.8px;">Explore Top Kitchens</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">Fresh, hygienic meals cooked on-demand by certified local chefs.</p>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); background: #FFF; padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--border);">
        <span style="width: 8px; height: 8px; background: #10B981; border-radius: 50%;"></span>
        <strong style="color: var(--dark);" id="kitchens-online-count">3 Kitchens</strong> Open for Delivery
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div style="display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; align-items: center;">
      <div style="flex: 1; min-width: 280px; position: relative;">
        <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--text-muted);">🔍</span>
        <input type="text" id="search-box" class="form-input" placeholder="Search kitchens or cuisines (e.g. Biryani, Burger)..." style="padding-left: 42px; border-radius: var(--radius-full); box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
      </div>

      <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;" id="filter-chips">
        <button class="category-chip active" data-cuisine="All">All Cuisines</button>
        <button class="category-chip" data-cuisine="Burgers">🍔 Burgers & Fast Food</button>
        <button class="category-chip" data-cuisine="Biryani">🍗 Biryani & Mughlai</button>
        <button class="category-chip" data-cuisine="South Indian">🥗 South Indian & Veg</button>
      </div>
    </div>

    <!-- Restaurants Grid -->
    <div class="grid-restaurants" id="restaurants-grid">
      <div class="card skeleton" style="height: 330px; border-radius: var(--radius-lg);"></div>
      <div class="card skeleton" style="height: 330px; border-radius: var(--radius-lg);"></div>
      <div class="card skeleton" style="height: 330px; border-radius: var(--radius-lg);"></div>
    </div>
  </div>

  <!-- Sticky Bottom Cart Bar -->
  <div id="bottom-cart-bar" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 660px; background: rgba(23, 23, 23, 0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); color: #FFF; padding: 12px 24px; border-radius: var(--radius-full); box-shadow: 0 12px 36px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12); display: none; align-items: center; justify-content: space-between; z-index: 90; animation: slideUp 0.3s ease;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 1.4rem;">🛒</span>
      <div>
        <div style="font-weight: 700;">
          <span id="bottom-cart-count">0 items</span> in your cart
          <span style="color: rgba(255,255,255,0.4); margin: 0 6px;">•</span>
          <span id="bottom-cart-total" style="font-weight: 800; color: var(--primary);">₹0.00</span>
        </div>
        <div style="font-size: 0.76rem; color: rgba(255,255,255,0.6);">Ready for checkout</div>
      </div>
    </div>
    <a href="./cart.html" class="bottom-checkout-pill">
      View Cart & Checkout →
    </a>
  </div>

  <script type="module">
    import { checkAuth, renderNavbar } from '../shared/js/auth.js';
    import { apiRequest, getCartTotalCount, getCart } from '../shared/js/api.js';

    let allRestaurants = [];
    let currentCuisine = 'All';

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      renderNavbar('restaurants');

      // Check URL query parameters
      const params = new URLSearchParams(window.location.search);
      const searchParam = params.get('search');
      const cuisineParam = params.get('cuisine');

      if (searchParam) {
        document.getElementById('search-box').value = searchParam;
      }
      if (cuisineParam) {
        currentCuisine = cuisineParam;
      }

      setupEventListeners();
      loadRestaurants();
      updateBottomCartBar();

      window.addEventListener('cart-updated', () => {
        updateBottomCartBar();
      });

      window.addEventListener('storage', (e) => {
        if (!e.key || e.key === 'foodnest_cart') {
          updateBottomCartBar();
        }
      });

      window.addEventListener('focus', () => {
        updateBottomCartBar();
      });
    });

    function setupEventListeners() {
      const searchBox = document.getElementById('search-box');
      searchBox.addEventListener('input', () => filterAndRender());

      document.querySelectorAll('#filter-chips .category-chip').forEach(btn => {
        if (btn.dataset.cuisine.toLowerCase() === currentCuisine.toLowerCase()) {
          document.querySelectorAll('#filter-chips .category-chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
        }
        btn.addEventListener('click', () => {
          document.querySelectorAll('#filter-chips .category-chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          currentCuisine = btn.dataset.cuisine;
          filterAndRender();
        });
      });
    }

    async function loadRestaurants() {
      const res = await apiRequest('/restaurants');
      if (res.success && res.data) {
        allRestaurants = res.data;
        const countEl = document.getElementById('kitchens-online-count');
        if (countEl) countEl.textContent = `${allRestaurants.length} Kitchens`;
        filterAndRender();
      }
    }

    function filterAndRender() {
      let filtered = allRestaurants;
      const searchVal = document.getElementById('search-box').value.trim().toLowerCase();

      if (currentCuisine !== 'All') {
        filtered = filtered.filter(r => 
          r.cuisineType && r.cuisineType.toLowerCase().includes(currentCuisine.toLowerCase())
        );
      }

      if (searchVal) {
        filtered = filtered.filter(r => 
          r.name.toLowerCase().includes(searchVal) || 
          (r.cuisineType && r.cuisineType.toLowerCase().includes(searchVal)) ||
          (r.address && r.address.toLowerCase().includes(searchVal))
        );
      }

      const grid = document.getElementById('restaurants-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px;">
            <div style="font-size: 2.4rem; margin-bottom: 8px;">🍽️</div>
            <h3>No restaurants found matching your criteria.</h3>
            <p style="font-size: 0.9rem; margin-top: 4px;">Try searching for a different keyword or resetting cuisine filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map((r, index) => {
        const discountTag = index % 2 === 0 ? '🎁 50% OFF up to ₹100' : '⚡ Free Delivery Available';

        return `
          <div class="restaurant-card" onclick="window.location.href='./restaurant-menu.html?id=${r.id}'">
            <div class="card-img-wrap" style="height: 190px;">
              <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600'}" alt="${r.name}" class="card-img">
              <span class="card-badge">${r.cuisineType}</span>
              <span class="card-rating">★ ${r.rating}</span>
              <div class="discount-ribbon">
                <span>${discountTag}</span>
              </div>
            </div>
            <div class="card-body" style="padding: 20px;">
              <h3 class="card-title" style="font-size: 1.22rem; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between;">
                ${r.name}
                <span style="font-size: 0.72rem; color: #10B981; font-weight: 800; background: #D1FAE5; padding: 2px 8px; border-radius: var(--radius-full);">Open</span>
              </h3>
              <p class="card-subtitle" style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px;">${r.address}</p>
              
              <div class="card-footer" style="border-top: 1px dashed var(--border); padding-top: 12px; margin-top: auto; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 4px;">
                  <span>🕒</span> 25-35 mins
                </span>
                <span class="btn btn-primary btn-sm" style="border-radius: var(--radius-full); font-weight: 700; padding: 6px 16px;">
                  View Menu →
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateBottomCartBar() {
      const bar = document.getElementById('bottom-cart-bar');
      const countEl = document.getElementById('bottom-cart-count');
      const totalEl = document.getElementById('bottom-cart-total');
      if (!bar || !countEl) return;
      const total = getCartTotalCount();
      const cart = getCart();

      if (total > 0) {
        bar.style.display = 'flex';
        countEl.textContent = `${total} item${total > 1 ? 's' : ''}`;
        if (totalEl) {
          const subtotal = (cart.items || []).reduce((sum, i) => sum + (parseFloat(i.price || 0) * (i.quantity || 1)), 0);
          totalEl.textContent = `₹${subtotal.toFixed(2)}`;
        }
      } else {
        bar.style.display = 'none';
      }
    }
  </script>
</body>
</html>
